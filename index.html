<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickConvert Utility</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .converter-card {
            background: var(--card);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
        }

        h1 { text-align: center; font-size: 1.5rem; margin-bottom: 1.5rem; color: var(--primary); }

        .group { margin-bottom: 1.5rem; }

        label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus { outline: none; border-color: var(--primary); }

        .result-box {
            background: #f1f5f9;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--primary);
            min-height: 1.5rem;
        }

        footer { text-align: center; margin-top: 1rem; font-size: 0.8rem; opacity: 0.6; }
    </style>
</head>
<body>

<div class="converter-card">
    <h1>QuickConvert</h1>

    <div class="group">
        <label>Select Conversion</label>
        <select id="unitType" onchange="convert()">
            <option value="cToF">Celsius to Fahrenheit</option>
            <option value="kmToMi">Kilometers to Miles</option>
            <option value="kgToLb">Kilograms to Pounds</option>
        </select>
    </div>

    <div class="group">
        <label>Enter Value</label>
        <input type="number" id="inputValue" placeholder="0" oninput="convert()">
    </div>

    <div class="result-box" id="resultDisplay">
        Result will appear here
    </div>

    <footer>Built with HTML, CSS, and JS</footer>
</div>

<script>
    function convert() {
        const val = parseFloat(document.getElementById('inputValue').value);
        const type = document.getElementById('unitType').value;
        const display = document.getElementById('resultDisplay');

        if (isNaN(val)) {
            display.innerText = "Waiting for input...";
            return;
        }

        let result;
        let unit;

        if (type === "cToF") {
            result = (val * 9/5) + 32;
            unit = "°F";
        } else if (type === "kmToMi") {
            result = val * 0.621371;
            unit = " Miles";
        } else if (type === "kgToLb") {
            result = val * 2.20462;
            unit = " lbs";
        }

        display.innerText = result.toFixed(2) + unit;
    }
</script>

</body>
</html>
